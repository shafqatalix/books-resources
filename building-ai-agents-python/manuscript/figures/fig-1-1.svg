<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img"><title>The agent loop</title><desc>A goal goes to the model. The model asks for a tool, your code runs it, and the result goes back to the model. When finished, the model gives the answer.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="110" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="85.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Goal</text><text x="85.0" y="148.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">from the user</text><rect x="200" y="110" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="270.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Model</text><text x="270.0" y="148.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">decides next step</text><rect x="450" y="110" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="535.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Tools</text><text x="535.0" y="148.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">your code runs them</text><rect x="200" y="236" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="270.0" y="255.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Answer</text><text x="270.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">when finished</text><line x1="140" y1="138" x2="198" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="340" y1="126" x2="448" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="394" y="104" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">asks for a tool</text><line x1="450" y1="152" x2="342" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="396" y="174" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">result goes back</text><line x1="270" y1="166" x2="270" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="284" y="200" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">done</text></svg>