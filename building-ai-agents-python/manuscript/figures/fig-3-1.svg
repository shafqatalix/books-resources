<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img"><title>Waterfall view of one agent run</title><desc>An agent run of 1.8 seconds made of a model call, a tool call and a second model call that writes the answer.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="44" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">agent run</text><text x="40" y="62" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">1.8 s total</text><rect x="300" y="30" width="340" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="56" y="104" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">model</text><text x="56" y="122" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">0.7 s, picks get_weather</text><rect x="300" y="90" width="132" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="56" y="164" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">tools</text><text x="56" y="182" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">0.1 s, returns a forecast</text><rect x="432" y="150" width="19" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="56" y="224" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">model</text><text x="56" y="242" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">1.0 s, writes the answer</text><rect x="451" y="210" width="189" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="40" y="285" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">Bar length shows time spent. Timings are illustrative.</text></svg>