<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img"><title>Who does what in a tool call</title><desc>The model asks for a tool, your code runs the function, and the model writes the answer from the result.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="30" width="640" height="120" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="42" y="54" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489"></text><rect x="20" y="170" width="640" height="120" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="42" y="194" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041"></text><text x="36" y="90" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Model</text><text x="36" y="230" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Your code</text><rect x="125" y="60" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="225.0" y="81.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">1. Asks for a tool</text><text x="225.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">get_weather(city)</text><rect x="245" y="200" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="345.0" y="221.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">2. Runs the function</text><text x="345.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">plain Python code</text><rect x="450" y="60" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="550.0" y="81.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">3. Writes the answer</text><text x="550.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">using the result</text><path d="M225 120 V230 H243" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M445 230 H550 V122" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/></svg>