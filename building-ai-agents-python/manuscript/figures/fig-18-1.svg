<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img"><title>Architecture of the documents assistant</title><desc>A user talks to an agent that has three tools. One tool searches a vector store, one lists files, and one saves notes after human approval. A checkpointer remembers the chat and LangSmith traces and scores everything.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="150" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="70.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">User</text><text x="70.0" y="188.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">chats</text><rect x="145" y="40" width="440" height="250" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 5"/><text x="167" y="64" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Your assistant</text><rect x="210" y="90" width="310" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="365.0" y="111.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Agent</text><text x="365.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">create_agent + middleware</text><rect x="155" y="205" width="134" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="222.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">search_docs</text><text x="222.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">finds passages</text><rect x="295" y="205" width="134" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="362.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">list_documents</text><text x="362.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">lists files</text><rect x="435" y="205" width="134" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="502.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#633806">save_note</text><text x="502.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#854F0B">needs approval</text><line x1="120" y1="178" x2="208" y2="125" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="300" y1="150" x2="222" y2="203" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="365" y1="150" x2="362" y2="203" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="430" y1="150" x2="502" y2="203" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="605" y="92" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="655.0" y="111.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#0C447C">Memory</text><text x="655.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#185FA5">saves chat</text><line x1="520" y1="120" x2="603" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="160" y="320" width="125" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="222.5" y="345.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Vector store</text><line x1="222" y1="261" x2="222" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="20" y="392" width="680" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 5"/><text x="360" y="410" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">LangSmith traces every step and scores it against a dataset</text></svg>