<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img"><title>How LangSmith, LangGraph and LangChain nest</title><desc>LangSmith wraps everything and records it. Inside is the LangGraph runtime. Inside that is a LangChain agent made of a model, tools and instructions.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="20" width="600" height="330" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="62" y="44" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">LangSmith</text><text x="62" y="62" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">Records every step so you can replay it</text><rect x="70" y="86" width="540" height="234" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="92" y="110" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">LangGraph runtime</text><text x="92" y="128" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">Runs the loop and keeps state</text><rect x="100" y="144" width="480" height="148" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="122" y="168" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">LangChain agent</text><text x="122" y="186" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">Built with create_agent</text><rect x="120" y="208" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="185.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Model</text><text x="185.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">picks next step</text><rect x="275" y="208" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Tools</text><text x="340.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">do real work</text><rect x="430" y="208" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="495.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Instructions</text><text x="495.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">set behavior</text></svg>