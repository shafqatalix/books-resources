<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" role="img"><title>From script to service</title><desc>A script becomes a local dev server, which becomes a deployed service. LangSmith traces every stage.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="40" width="170" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="125.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Script</text><text x="125.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">python app.py</text><rect x="255" y="40" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Local dev server</text><text x="340.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">langgraph dev</text><rect x="470" y="40" width="170" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="555.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Deployed service</text><text x="555.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">real users</text><line x1="210" y1="72" x2="253" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="425" y1="72" x2="468" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="140" width="600" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 5"/><text x="340" y="162" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">LangSmith traces every stage</text></svg>