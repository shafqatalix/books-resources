<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img"><title>Pause and resume for human approval</title><desc>The agent proposes an action, the run pauses and is saved, a human decides, and the agent continues from the same thread.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="40" width="140" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="90.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Proposes</text><text x="90.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">a risky action</text><rect x="185" y="40" width="140" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="255.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#633806">Pauses</text><text x="255.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#854F0B">state is saved</text><rect x="350" y="40" width="140" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="420.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#712B13">Human decides</text><text x="420.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#993C1D">approve or reject</text><rect x="515" y="40" width="140" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="585.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Resumes</text><text x="585.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">same thread_id</text><line x1="160" y1="72" x2="183" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="325" y1="72" x2="348" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="490" y1="72" x2="513" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M90 132 V146 H585 V132" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 5"/><text x="337" y="172" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">The same thread_id picks the run back up</text></svg>