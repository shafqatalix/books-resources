<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img"><title>The evaluation loop</title><desc>A dataset feeds the agent run, evaluators score it, results are compared with the previous run, then one thing is changed and the loop repeats.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="35" y="50" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="115.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Dataset</text><text x="115.0" y="88.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">questions + answers</text><rect x="225" y="50" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="305.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Run agent</text><text x="305.0" y="88.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">on every example</text><rect x="415" y="50" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="495.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Score</text><text x="495.0" y="88.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">evaluators check it</text><rect x="415" y="180" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="495.0" y="199.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#0C447C">Compare</text><text x="495.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#185FA5">against last run</text><rect x="215" y="180" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="305.0" y="199.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#633806">Change one thing</text><text x="305.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#854F0B">prompt, tool, model</text><line x1="195" y1="78" x2="223" y2="78" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="385" y1="78" x2="413" y2="78" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="495" y1="106" x2="495" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="415" y1="208" x2="397" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="305" y1="180" x2="305" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/></svg>