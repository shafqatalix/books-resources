<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img"><title>From single call to agent</title><desc>Three approaches from a single model call, to a fixed workflow, to an agent, with increasing flexibility and cost.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="40" width="180" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="130.0" y="66.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Single call</text><text x="130.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">one prompt, one answer</text><rect x="250" y="40" width="180" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="66.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Workflow</text><text x="340.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">you fix the steps</text><rect x="460" y="40" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="550.0" y="66.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Agent</text><text x="550.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">the model picks steps</text><line x1="40" y1="150" x2="640" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="40" y="176" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">Cheaper and more predictable</text><text x="640" y="176" text-anchor="end" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">More flexible and costlier</text></svg>