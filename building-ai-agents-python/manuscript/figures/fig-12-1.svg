<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="680" height="336" role="img"><title>A router graph</title><desc>A classify node picks a route. Conditional edges send the question to billing, technical or general handler nodes, which all end the run.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="140" width="70" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="55.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">START</text><rect x="120" y="130" width="120" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="180.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">classify</text><text x="180.0" y="170.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">picks a route</text><rect x="315" y="40" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="395.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Billing handler</text><text x="395.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">billing</text><line x1="240" y1="160" x2="313" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="475" y1="68" x2="568" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="315" y="140" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="395.0" y="159.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Tech handler</text><text x="395.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">technical</text><line x1="240" y1="160" x2="313" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="475" y1="168" x2="568" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="315" y="240" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="395.0" y="259.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">General handler</text><text x="395.0" y="278.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">anything else</text><line x1="240" y1="160" x2="313" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="475" y1="268" x2="568" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="570" y="150" width="70" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="605.0" y="170.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">END</text><line x1="90" y1="160" x2="118" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/></svg>