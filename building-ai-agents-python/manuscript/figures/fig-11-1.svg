<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"><title>The agent loop as a graph</title><desc>Start goes to the model node. If the model asks for a tool the graph goes to the tools node and back to the model. Otherwise it ends.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="140" width="90" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="75.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">START</text><rect x="190" y="130" width="130" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="255.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">model</text><text x="255.0" y="170.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">calls the LLM</text><rect x="430" y="130" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="495.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">tools</text><text x="495.0" y="170.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">runs ToolNode</text><rect x="215" y="262" width="80" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="255.0" y="282.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">END</text><line x1="120" y1="160" x2="188" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="320" y1="160" x2="428" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="374" y="144" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">tool call</text><path d="M495 130 V92 H255 V128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="375" y="76" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">result goes back</text><line x1="255" y1="190" x2="255" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="267" y="228" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">no tool call</text></svg>