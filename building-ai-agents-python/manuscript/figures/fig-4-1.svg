<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img"><title>A chat model reads a list of messages</title><desc>A list of system, user and assistant messages goes into the chat model, which returns the next assistant message.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="24" width="380" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="230.0" y="38.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">system</text><text x="230.0" y="57.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">You are a patient teacher.</text><rect x="40" y="80" width="380" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="230.0" y="94.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#0C447C">user</text><text x="230.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#185FA5">What is an API?</text><rect x="40" y="136" width="380" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">assistant</text><text x="230.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">Think of a menu in a restaurant.</text><rect x="40" y="192" width="380" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="230.0" y="206.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#0C447C">user</text><text x="230.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#185FA5">Can you give a code example?</text><path d="M420 47 H434 V215 H420" fill="none" stroke="#5F5E5A" stroke-width="1.5"/><line x1="434" y1="131" x2="473" y2="131" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="475" y="96" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="560.0" y="122.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Chat model</text><text x="560.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">reads the whole list</text><line x1="560" y1="166" x2="560" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="475" y="214" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="560.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Next reply</text><text x="560.0" y="252.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">added to the list</text></svg>