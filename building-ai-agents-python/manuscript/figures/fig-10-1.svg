<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img"><title>Memory is kept per thread</title><desc>A checkpointer stores saved steps separately for each thread id, so alice and bob have separate memories.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="20" width="640" height="250" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 5"/><text x="42" y="44" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#2C2C2A">Checkpointer saves state per thread</text><text x="40" y="102" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">thread_id = alice</text><rect x="220" y="80" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="275.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Step 1</text><line x1="330" y1="102" x2="348" y2="102" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="350" y="80" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="405.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Step 2</text><line x1="460" y1="102" x2="478" y2="102" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="480" y="80" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="535.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Step 3</text><text x="40" y="192" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">thread_id = bob</text><rect x="220" y="170" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="275.0" y="192.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Step 1</text><line x1="330" y1="192" x2="348" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="350" y="170" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="405.0" y="192.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Step 2</text><text x="40" y="248" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#5F5E5A">A different thread_id means a separate memory.</text></svg>