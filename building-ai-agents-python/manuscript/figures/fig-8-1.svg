<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img"><title>The retrieval pipeline</title><desc>Top row: documents are split into chunks, embedded and stored once. Bottom row: for each question, the closest chunks are found, added to the prompt and the model answers.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="28" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Index once</text><rect x="40" y="44" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="105.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Files</text><text x="105.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">your documents</text><rect x="200" y="44" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="265.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Split</text><text x="265.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">small chunks</text><rect x="360" y="44" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="425.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Embed</text><text x="425.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">text to numbers</text><rect x="520" y="44" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="585.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#085041">Store</text><text x="585.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#0F6E56">vector store</text><line x1="170" y1="72" x2="198" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="330" y1="72" x2="358" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="490" y1="72" x2="518" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><text x="40" y="168" text-anchor="start" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Ask many times</text><rect x="40" y="190" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="105.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Question</text><text x="105.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">from the user</text><rect x="200" y="190" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="265.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Search</text><text x="265.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">finds closest</text><rect x="360" y="190" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="425.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Add context</text><text x="425.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">to the prompt</text><rect x="520" y="190" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="585.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" font-weight="500" fill="#3C3489">Answer</text><text x="585.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.0" font-weight="400" fill="#534AB7">from the model</text><line x1="170" y1="218" x2="198" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="330" y1="218" x2="358" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="490" y1="218" x2="518" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/><path d="M585 100 V145 H265 V188" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ah)"/></svg>